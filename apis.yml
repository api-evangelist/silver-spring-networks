name: Silver Spring Networks *
description: 'Silver Spring Networks was a smart-grid, smart-city, and IoT networking company that built
  wireless canopy networks and the SLV/Data Platform for utilities, offering RESTful Data Platform APIs
  (device registration, device metadata, sensor data, and webhook event notifications) plus an SDK on its
  developer portal at developer.ssni.com. Itron completed its acquisition of the company in January 2018
  for approximately USD 830 million and rebranded it Itron Networked Solutions; the standalone ssni.com and
  developer.ssni.com properties are now offline. Enrichment pass 2026-07-21 found no live API surface: all
  legacy domains fail to resolve and the historical developer portal is no longer reachable.'
